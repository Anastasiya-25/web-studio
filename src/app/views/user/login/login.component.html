<section class="login" [formGroup]="loginForm">
  <div class="container">
    <div class="auth-form">
      <div class="auth-title">Войти в личный кабинет</div>
      <div class="auth-inputs">
        <div class="auth-input">
          <input type="text" class="input" placeholder="Электронная почта"
                 [ngStyle]="{'border-color': loginForm.get('email')?.invalid &&
                 (loginForm.get('email')?.dirty || loginForm.get('email')?.touched) ? 'red' : ''}"
                 formControlName="email">

          <div class="invalid-feedback"
               *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">
                <span *ngIf="loginForm.get('email')?.errors?.['required']">
                Email обязателен для заполнения.
                </span>
            <span *ngIf="loginForm.get('email')?.errors?.['pattern']">
                Пожалуйста, введите корректный адрес электронной почты.
          </span>
          </div>

        </div>

        <div class="auth-input">
          <input type="password" class="input" placeholder="Пароль"
                 [ngStyle]="{'border-color': loginForm.get('password')?.invalid &&
                 (loginForm.get('password')?.dirty || loginForm.get('password')?.touched) ? 'red' : ''}"
                 formControlName="password">

          <div class="invalid-feedback"
               *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
                <span *ngIf="loginForm.get('password')?.errors?.['required']">
                Пароль обязателен для заполнения.
                </span>
            <span *ngIf="loginForm.get('password')?.errors?.['pattern']">
                Пожалуйста, введите корректный пароль.
            </span>
          </div>
        </div>

        <div class="auth-checkbox">
          <input type="checkbox" id="remember" formControlName="rememberMe">
          <label for="remember">Запомнить меня</label>
        </div>
      </div>
      <div class="auth-button">
        <button class="button" [disabled]="loginForm.invalid" (click)="login()">Войти</button>
      </div>

      <div class="auth-link">
        Нет аккаунта? <a routerLink="/signup">Пройдите регистрацию</a>
      </div>

    </div>

    <div class="page-image">
      <img src="/assets/images/page/login-page.png" alt="user">
    </div>
  </div>
</section>
